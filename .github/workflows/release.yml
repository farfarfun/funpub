name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        run: |
          set -eu
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml 里读不出 [workspace.package] 的 version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 和 Cargo.toml 里的 ${version} 对不上"
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"

  wheels:
    name: wheel (${{ matrix.platform.target }}${{ matrix.platform.manylinux && format(' {0}', matrix.platform.manylinux) || '' }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}

      - name: Smoke test
        if: matrix.platform.target != 'aarch64-unknown-linux-gnu' && matrix.platform.target != 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python -m pip install --find-links dist --no-index funpub
          python -c "import funpub; print(funpub.get_publisher, funpub.list_available_channels(), funpub.PublishResult)"
          python -c "import importlib.metadata as m; cs=[e for e in m.distribution('funpub').entry_points if e.group=='console_scripts']; assert not cs, cs; print('ok: no console_scripts in wheel')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'auto' }}
          path: dist

  binaries:
    name: cli (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            tarball: "yes"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            tarball: "yes"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            tarball: "yes"
          - runner: macos-latest
            target: aarch64-apple-darwin
            tarball: "yes"
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: contains(matrix.platform.target, 'musl')
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Build
        run: cargo build --release --locked --package funpub --target ${{ matrix.platform.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          mkdir -p artifacts
          if [ -n "${{ matrix.platform.tarball }}" ]; then
            tar -czf "artifacts/funpub-${{ matrix.platform.target }}.tar.gz" \
              -C "target/${{ matrix.platform.target }}/release" funpub
          fi
          mv "target/${{ matrix.platform.target }}/release/funpub${{ matrix.platform.suffix }}" \
             "artifacts/funpub-${{ matrix.platform.target }}${{ matrix.platform.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform.target }}
          path: artifacts

  deb:
    name: deb (${{ matrix.arch }})
    needs: [check, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, target: x86_64-unknown-linux-musl }
          - { arch: arm64, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: artifacts

      - name: Build .deb
        run: |
          set -eu
          sudo apt-get update -y && sudo apt-get install -y dpkg-dev
          mkdir -p stage
          tar -xzf "artifacts/funpub-${{ matrix.target }}.tar.gz" -C stage
          bash packaging/build-deb.sh stage/funpub \
            "${{ needs.check.outputs.version }}" "${{ matrix.arch }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  github-release:
    name: github release
    needs: [check, binaries, deb]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: binaries
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: binaries
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: binaries
        run: |
          sha256sum ./* | sed 's|\./||' >SHA256SUMS
          cat SHA256SUMS

      - name: Attach the CLI binaries, tarballs and .deb to the release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true

  pypi:
    name: publish pypi
    needs: [check, wheels, sdist]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: astral-sh/setup-uv@v5

      # 优先走 OIDC Trusted Publishing；尚未登记 publisher 时回退到组织级 PYPI_TOKEN。
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv publish \
            --trusted-publishing automatic \
            --check-url https://pypi.org/simple/ \
            dist/*

  crates:
    needs: [wheels, binaries, sdist]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check crates.io publish status
        id: check
        run: |
          set -euo pipefail
          need_publish=false
          for pkg in funpub-core funpub; do
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .version')"
            if [ -z "${version}" ]; then
              echo "::error::在 cargo metadata 里找不到 ${pkg}"
              exit 1
            fi
            if curl -sfo /dev/null \
                -H 'User-Agent: farfarfun-funpub-release' \
                "https://crates.io/api/v1/crates/${pkg}/${version}"; then
              echo "${pkg} ${version} 已在 crates.io，跳过"
            else
              echo "${pkg} ${version} 待发布"
              need_publish=true
            fi
          done
          echo "need_publish=${need_publish}" >>"$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.check.outputs.need_publish == 'true'

      - name: Publish to crates.io
        if: steps.check.outputs.need_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for pkg in funpub-core funpub; do
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .version')"
            if curl -sfo /dev/null \
                -H 'User-Agent: farfarfun-funpub-release' \
                "https://crates.io/api/v1/crates/${pkg}/${version}"; then
              echo "${pkg} ${version} 已在 crates.io，跳过"
              continue
            fi
            echo "发布 ${pkg} ${version}"
            cargo publish -p "${pkg}" --locked
          done
