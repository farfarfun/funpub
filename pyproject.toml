[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "funpub"
version = "0.2.0"
description = "多渠道制品发布工具"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["artifact", "publish", "aliyun", "upload", "repository"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
]
# 零运行时依赖：HTTP、校验和、分块上传与 funsecret 凭据读取全部在 Rust 扩展内完成。
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

# 对齐 funget / funsecret：PyPI 包只提供 Python API，不再安装 funpub 命令行入口。
# 命令行统一通过 apt / brew / cargo install / GitHub Release 静态二进制分发，避免与系统 PATH 冲突。

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funpub"
Releases = "https://github.com/farfarfun/funpub/releases"

[tool.maturin]
features = ["pyo3/abi3-py312"]
module-name = "funpub._funpub"
python-source = "src"
manifest-path = "crates/funpub-py/Cargo.toml"
strip = true

[tool.ruff]
src = ["src"]
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PLE", "T100", "S102"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
